[package]
name = "omawall"
version = "1.1.0"
edition = "2021"
description = "Обои и меню выбора обоев для Omarchy"
license = "MIT"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.16"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fast_image_resize = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
