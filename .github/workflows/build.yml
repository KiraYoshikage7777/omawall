# Builds bin/omawall from this repository's source on GitHub's runners and
# publishes a signed build-provenance attestation for it. Anyone can check
# that the binary shipped in bin/ came from this workflow and this source:
#
#   gh attestation verify bin/omawall --repo KiraYoshikage7777/omawall
#
name: Build bin/omawall

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-binary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Omarchy is Arch Linux: build against the same libraries it ships.
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust gcc pkgconf wayland libxkbcommon

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo build --release --locked
          install -m755 target/release/omawall bin/omawall
          sha256sum bin/omawall | tee bin/omawall.sha256
          echo "source $GITHUB_SHA" >> bin/omawall.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/omawall

      - name: Commit the binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/omawall bin/omawall.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Build bin/omawall from ${GITHUB_SHA::7}"
          git push
